<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commenomy Beta</title><style>body{background:#101d37;color:#fff;font:16px system-ui;margin:0}main{max-width:600px;margin:auto;padding:20px}section{background:#203153;border-radius:16px;padding:16px;margin:14px 0}button,input,select{font:inherit;padding:10px;border:0;border-radius:8px;margin:4px}button{background:#3bd2e2;color:#071c34}h1{color:#ffb74d}</style><main><h1>↗ Commenomy Beta</h1><section><h2>Oyuncu</h2><input id="name" placeholder="Oyuncu adı"><button onclick="setName()">Kaydet</button><p id="profile"></p></section><section><h2>Ekonomi</h2><p id="stats"></p><button onclick="land()">Devlet arsası al (100)</button><button onclick="work()">Üretim yap</button></section><section><h2>Seçimler</h2><p>Parti yok. Başkan ve milletvekili adaylıkları ayrıdır.</p><input id="candidate" placeholder="Aday adı"><select id="role"><option value="pres">Başkan</option><option value="mp">Milletvekili</option></select><button onclick="nominate()">Aday ekle</button><div id="elections"></div></section><section><h2>Kanunlar</h2><p>Yalnızca başkan teklif eder. Başkan 2, her milletvekili 1 oy. Kabul için 3 oy.</p><input id="law" placeholder="Kanun teklifi"><button onclick="propose()">Teklif sun</button><div id="votes"></div></section><section><h2>Günlük</h2><p id="log"></p></section></main><script>
let s=JSON.parse(localStorage.getItem('cgame')||'null')||{name:'',money:500,lands:0,stock:8,pres:[],mp:[],presWinner:'',mpWinners:[],law:'',votes:{},history:[]};
function save(){localStorage.setItem('cgame',JSON.stringify(s));render()}function note(t){s.history.unshift(t);s.history=s.history.slice(0,8)}
function setName(){let n=document.getElementById('name').value.trim();if(n.length<3)return alert('En az 3 karakter');s.name=n;save()}
function land(){if(!s.name)return alert('Önce oyuncu adı');if(s.money<100||!s.stock)return alert('Para veya arsa yetersiz');s.money-=100;s.stock--;s.lands++;note('Devlet arsası alındı');save()}
function work(){if(!s.lands)return alert('Önce arsa al');s.money+=s.lands*30;note('Üretim yapıldı');save()}
function nominate(){let n=document.getElementById('candidate').value.trim();if(!n)return;if([...s.pres,...s.mp].includes(n))return alert('Aday yalnızca bir seçimde olabilir');s[document.getElementById('role').value].push(n);save()}
function elect(r,n){if(r==='pres'){s.presWinner=n}else if(s.mpWinners.length<3&&!s.mpWinners.includes(n)){s.mpWinners.push(n)}save()}
function propose(){if(!s.presWinner||s.mpWinners.length!==3)return alert('Önce yönetimi seç');s.law=document.getElementById('law').value.trim();s.votes={};save()}
function vote(n,yes){if(s.votes[n]!==undefined)return;s.votes[n]=yes;if(Object.keys(s.votes).length===4){let count=(s.votes[s.presWinner]?2:0)+s.mpWinners.filter(x=>s.votes[x]).length;note('Kanun '+(count>=3?'kabul':'ret')+' ('+count+'/5): '+s.law);s.law='';s.votes={}}save()}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){document.getElementById('profile').textContent=s.name?'Oyuncu: '+s.name:'Oyuncu adını belirle';document.getElementById('stats').textContent='Para: '+s.money+' | Arsa: '+s.lands+' | Devlet arsası: '+s.stock;let h='Başkan: '+esc(s.presWinner||'seçilmedi')+'<br>Milletvekilleri: '+s.mpWinners.map(esc).join(', ');for(let r of ['pres','mp']){h+='<h3>'+(r==='pres'?'Başkan':'Milletvekili')+' adayları</h3>';for(let n of s[r])h+='<p>'+esc(n)+' <button onclick="elect('+JSON.stringify(r)+','+JSON.stringify(n).replace(/"/g,'&quot;')+')">Seç</button></p>'}document.getElementById('elections').innerHTML=h;document.getElementById('votes').innerHTML=s.law?'<p>'+esc(s.law)+'</p>'+[s.presWinner,...s.mpWinners].map(n=>'<p>'+esc(n)+' <button onclick="vote('+JSON.stringify(n).replace(/"/g,'&quot;')+',true)">Kabul</button><button onclick="vote('+JSON.stringify(n).replace(/"/g,'&quot;')+',false)">Ret</button></p>').join(''):'Teklif yok';document.getElementById('log').textContent=s.history.join(' • ')}render();
</script></html>
