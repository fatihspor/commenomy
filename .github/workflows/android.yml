name: Commenomy Android Beta
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate prototype and Android assets
        run: node tests/prototype-smoke.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Validate actual APK package and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -Fx classes.dex
          unzip -Z1 "$APK" | grep -Fx assets/index.html
          test "$(stat -c%s "$APK")" -gt 20000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.commenomy.game'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK_BYTES=$(stat -c%s "$APK")"
      - name: Emulator installation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.commenomy.game
            adb shell am start -W -n com.commenomy.game/.MainActivity
            sleep 8
            adb shell pidof com.commenomy.game | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.commenomy.game'
            if adb logcat -d -t 1000 | grep -E 'FATAL EXCEPTION|Process: com.commenomy.game' | grep -F 'com.commenomy.game'; then
              echo 'App crash detected'; exit 1
            fi
      - name: Upload emulator-tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Commenomy-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
