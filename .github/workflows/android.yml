name: Commenomy Android Beta
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Validate actual APK package and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -Fx classes.dex
          unzip -Z1 "$APK" | grep -Fx assets/index.html
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.commenomy.game'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK_BYTES=$(stat -c%s "$APK")"
      - name: Emulator installation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.commenomy.game
            adb shell am start -n com.commenomy.game/.MainActivity
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Commenomy-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
