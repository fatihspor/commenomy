name: Commenomy Android Beta
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle assembleDebug
      - name: Validate Android APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s "$APK")" -gt 8192
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -Fx classes.dex
          unzip -Z1 "$APK" | grep -Fx assets/index.html
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Commenomy-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
