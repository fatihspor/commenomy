name: Commenomy Android Beta
on:
  push:
    branches: [main, feature/mine-company-card-no-apk]
  workflow_dispatch:
concurrency:
  group: commenomy-android-beta-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate prototype and Android assets
        run: |
          node tests/prototype-smoke.cjs
          node tests/rental-runtime.cjs
          node tests/household-demand.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Validate actual APK package and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -Fx classes.dex
          unzip -Z1 "$APK" | grep -Fx assets/index.html
          unzip -Z1 "$APK" | grep -Fx AndroidManifest.xml
          test "$(stat -c%s "$APK")" -gt 10000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.commenomy.game'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK_BYTES=$(stat -c%s "$APK")"
      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: Commenomy-Hizlandirilmis-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Grant the runner access to Android hardware acceleration
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Emulator installation smoke test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          profile: pixel_2
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: |
            timeout 30s adb wait-for-device
            timeout 90s sh -c 'until adb shell pm path android | grep -Fq "package:"; do sleep 2; done'
            timeout 30s adb shell settings put global package_verifier_enable 0
            timeout 30s adb shell settings put global verifier_verify_adb_installs 0
            timeout 120s adb install --no-streaming -r -t app/build/outputs/apk/debug/app-debug.apk
            timeout 30s adb shell pm path com.commenomy.game
            timeout 30s adb logcat -c
            timeout 60s adb shell monkey -p com.commenomy.game -c android.intent.category.LAUNCHER 1
            timeout 120s sh -c 'until adb logcat -d -s CommenomyWeb:I | grep -Fq "Page load finished:"; do sleep 2; done'
            timeout 30s adb logcat -d -s CommenomyWeb:I > commenomy-webview.txt
            grep -F 'Page load finished:' commenomy-webview.txt
            timeout 30s adb shell pidof com.commenomy.game | grep -Eq '[0-9]+'
            timeout 30s adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.commenomy.game'
            timeout 30s adb exec-out screencap -p > commenomy-launch.png
            test "$(stat -c%s commenomy-launch.png)" -gt 1000
            file commenomy-launch.png | grep -F "PNG image data"
            timeout 30s adb shell logcat -d -v brief > commenomy-logcat.txt
            grep -F 'Page load finished:' commenomy-logcat.txt
            ! grep -Fq 'Process: com.commenomy.game' commenomy-logcat.txt
            ! grep -Fq 'Process: com.commenomy.game' commenomy-logcat.txt

      - name: Upload emulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Commenomy-Emulator-Diagnostics
          path: |
            commenomy-launch.png
            commenomy-logcat.txt
          if-no-files-found: ignore
