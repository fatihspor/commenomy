name: Commenomy Android Beta
on:
  push:
    branches: [main, feature/mine-company-card-no-apk]
  workflow_dispatch:
concurrency:
  group: commenomy-android-beta
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate prototype and Android assets
        run: node tests/prototype-smoke.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Validate actual APK package and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -Fx classes.dex
          unzip -Z1 "$APK" | grep -Fx assets/index.html
          unzip -Z1 "$APK" | grep -Fx AndroidManifest.xml
          test "$(stat -c%s "$APK")" -gt 10000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.commenomy.game'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK_BYTES=$(stat -c%s "$APK")"
      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: Commenomy-Hizlandirilmis-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Emulator installation smoke test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: |
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.commenomy.game
            adb logcat -c
            adb shell am start -W -n com.commenomy.game/.MainActivity
            sleep 8
            adb shell pidof com.commenomy.game | grep -Eq '[0-9]+'
            adb exec-out screencap -p > commenomy-launch.png
            test "$(stat -c%s commenomy-launch.png)" -gt 1000
            file commenomy-launch.png | grep -F "PNG image data"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.commenomy.game'
            adb logcat -d -v brief > commenomy-logcat.txt
            ! grep -Fq 'Process: com.commenomy.game' commenomy-logcat.txt

      - name: Upload emulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Commenomy-Emulator-Screenshot
          path: commenomy-launch.png
          if-no-files-found: ignore
