name: Company 1.1.32 UI checks (no APK)
on:
  push:
    branches: [feature/company-1.1.32-ui]
  workflow_dispatch:
jobs:
  company-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game behavior
        run: |
          node tests/prototype-smoke.cjs
          node tests/rental-runtime.cjs
          node tests/household-demand.cjs
          node tests/modern-runtime.cjs
      - name: Validate mobile company interactions and layouts
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/browser-smoke.cjs
          node tests/company-browser.cjs
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Company-1.1.32-UI-Checks
          path: test-results/
          if-no-files-found: ignore
